<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcousticMate</title>
  <script>
    const showStartupError = error => {
      const target = document.querySelector('#app');
      if (!target) return;
      const message = error?.reason?.message ?? error?.error?.message ?? error?.message ?? 'Unknown startup error';
      const output = document.createElement('pre');
      output.className = 'startup-error';
      output.textContent = `AcousticMate could not start.\n\n${String(message)}`;
      target.replaceChildren(output);
    };
    window.addEventListener('error', showStartupError);
    window.addEventListener('unhandledrejection', showStartupError);
  </script>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
